name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full test-gate matrix instead of letting impact selection reduce it.
        type: boolean
        default: true
  # Daily drift run. Impact selection may reduce a push to the repository preflight when only
  # documentation that nothing reads changed, so a scheduled FULL run guarantees that a full
  # attestation exists near every commit and that drift (runner images, packages, time-dependent
  # tests) cannot hide behind a run of reduced pushes.
  schedule:
    - cron: "37 3 * * *"
  push:
    branches:
      - main

concurrency:
  # A scheduled or manual FULL run must not cancel (or be cancelled by) the push run in flight,
  # so they get their own group; pushes still cancel superseded pushes.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reads earlier ci.yml runs and their jobs to find the full-coverage anchor commit.
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # A gate runs `dotnet test` once per project, so a single job starts MSBuild many times over. With
  # node reuse on, worker processes from one invocation outlive it and can still hold a handle to an
  # intermediate assembly when the next invocation compiles it, which fails the whole gate with
  # "CSC : error CS2012 ... because it is being used by another process". That took main red on run
  # 33994120035 (FreeP windows freep-wpf-desktop). The sibling workflows freep-ci, freew-ci and
  # tester-release already avoid this by passing -p:NodeReuse=false /nr:false explicitly; this gate
  # sets it as an environment variable instead so it reaches the MSBuild instances that
  # Invoke-TestGate.ps1 spawns without threading flags through the script.
  #
  # Deliberately NOT also setting UseSharedCompilation=false or -m:1 the way those workflows do:
  # both cost real build time (no compiler server, no parallel projects) and the lock observed here
  # is between separate MSBuild invocations, which disabling node reuse alone addresses.
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  # Burst debounce. main takes roughly a commit a minute from parallel sessions, and every push
  # used to start the full ~66 runner-minute matrix only to be cancelled by the next push (about
  # 17% of ci.yml minutes). The concurrency group above already cancels a superseded push run
  # (pending OR in progress), so the cheapest correct fix is to give the next push a short window
  # to arrive BEFORE the expensive jobs start: `prepare` (and so the whole matrix) only begins
  # after this job, and a newer push cancels this run while it sleeps.
  #
  # Safety: this adds no new outcome. A superseded commit ends up `cancelled`, exactly as it did
  # before when the next push cancelled it mid-matrix, and the release-candidate resolver
  # (tools/Resolve-GitHubReleaseCandidate.ps1) already skips any commit that lacks a successful
  # ci.yml run and walks to the newest attested ancestor. Nothing here can turn a run green: the job
  # has no outputs, `prepare` still decides coverage, and a newest commit is never cancelled by
  # anyone, so it always runs the matrix it ran before.
  #
  # Latency: the wait is paid only when another push run was created on main within the last 5
  # minutes (a burst); an isolated push, the daily schedule and workflow_dispatch skip it. Any API
  # failure waits anyway (costs latency only).
  debounce:
    name: Debounce push burst
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for a newer push when one is in flight
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEBOUNCE_SECONDS: "60"
          BURST_WINDOW_SECONDS: "300"
        run: |
          $burst = $true
          try {
            $text = & gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" `
              -f 'branch=main' -f 'event=push' -f 'per_page=10'
            if ($LASTEXITCODE -ne 0) { throw 'gh api failed.' }
            $cutoff = (Get-Date).ToUniversalTime().AddSeconds(-[int]$env:BURST_WINDOW_SECONDS)
            $recent = @(($text | ConvertFrom-Json).workflow_runs |
              Where-Object { [string]$_.id -ne $env:GITHUB_RUN_ID -and ([datetime]$_.created_at).ToUniversalTime() -gt $cutoff })
            $burst = $recent.Count -gt 0
            Write-Host "Other push runs created in the last $env:BURST_WINDOW_SECONDS s: $($recent.Count)."
          }
          catch {
            Write-Host "Could not inspect recent runs ($($_.Exception.Message)); treating this push as part of a burst."
          }
          if ($burst) {
            Write-Host "Burst: waiting $env:DEBOUNCE_SECONDS s so a newer push can cancel this run before the matrix starts."
            Start-Sleep -Seconds ([int]$env:DEBOUNCE_SECONDS)
          }
          else {
            Write-Host 'Isolated push: no wait.'
          }

  prepare:
    name: Select test gates
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.coverage.outputs.mode }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      # Full commit history, but no file contents (blob:none): the coverage selector only needs the
      # commit graph and a name-only tree comparison against its anchor commit.
      - name: Checkout gate manifest and commit graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # Decides what this push must prove. Anything not provably inert -- and any failure to decide --
      # selects the FULL matrix; see tools/CiImpactSupport.ps1 for the safety argument.
      - name: Select CI coverage
        id: coverage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          $full = $env:CI_FORCE_FULL -eq 'true'
          pwsh -NoProfile -File tools/Select-CiCoverage.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -Sha $env:GITHUB_SHA `
            -EventName $env:GITHUB_EVENT_NAME `
            -Full:$full `
            -GitHubOutputPath $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build test matrix from the repository contract
        id: matrix
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-TestGateMatrix.ps1 -Gate commit -Coverage ${{ steps.coverage.outputs.mode || 'full' }} -GitHubOutputPath $env:GITHUB_OUTPUT

  tests:
    name: ${{ matrix.app }} ${{ matrix.platform }} ${{ matrix.displayGateId }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetchDepth }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-
      # Compilation is the largest slice of a gate job (measured: 169s of a 300s gate, against 34s
      # of restore and ~97s of actual tests), so the intermediate output is cached between runs.
      # Only obj/ is cached, never bin/: obj/ is ~0.1 GB per gate where bin/ is ~2 GB, and 22 jobs
      # of bin/ would exceed the 10 GB repository cache budget. bin/ is cheap to reconstitute by
      # copying out of obj/.
      - name: Cache build intermediates
        if: matrix.runGate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/obj
            obj-build-cache-commit.txt
          key: buildcache-v1-${{ runner.os }}-${{ matrix.displayGateId }}-${{ github.sha }}
          restore-keys: buildcache-v1-${{ runner.os }}-${{ matrix.displayGateId }}-
      # Reusing that cache is ONLY safe after this runs. A checkout stamps every source file with
      # the checkout time and the cache is unpacked afterwards, so left alone every restored output
      # looks newer than every source and MSBuild silently skips compiling changed code -- a green
      # build of the previous commit. This rewrites timestamps so they encode what git says actually
      # changed; see the script for the full argument and the fallback to a clean build.
      - name: Make build-cache timestamps honest
        if: matrix.runGate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Set-BuildCacheTimestamps.ps1
      - name: Record the commit this cache will hold
        if: matrix.runGate
        shell: pwsh
        run: '"${{ github.sha }}" | Set-Content -LiteralPath obj-build-cache-commit.txt -Encoding ascii'
      - name: Run repository-static preflight
        if: matrix.runStaticPreflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1 -Mode Static
      - name: Run platform behavior preflight
        if: matrix.runPlatformPreflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1 -Mode Platform
      # runGate is false only for a reduced (inert-documentation) run, which still runs the
      # repository preflight on every leg that owns one but skips the test gate itself.
      - name: Run isolated test gate
        if: matrix.runGate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate "${{ matrix.gate }}" `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -GateId "${{ matrix.gateId }}" `
            -PartitionIndex ${{ matrix.partitionIndex }} `
            -PartitionCount ${{ matrix.partitionCount }} `
            -HangTimeout 15m `
            -ResultsDirectory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ matrix.platform }}-${{ matrix.displayGateId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 7

  # Evidence for release resolution. The job NAME records what this run covered: "full" or
  # "inert anchor=<sha>" (only documentation nothing reads differs from that anchor commit, whose own
  # successful full run therefore stands for this one). tools/Test-GitHubReleaseCandidate.ps1 reads it
  # back, so a reduced run can never be mistaken for a full attestation.
  coverage:
    name: "CI coverage: ${{ needs.prepare.outputs.coverage }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record coverage
        shell: pwsh
        run: |
          Write-Host "CI coverage: ${{ needs.prepare.outputs.coverage }}"

  quality-gate:
    # Keep the established required-check name so branch protection does not need migration.
    name: FreeX commit gate
    needs: [prepare, coverage, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate all app and platform gates
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $coverageResult = "${{ needs.coverage.result }}"
          $testResult = "${{ needs.tests.result }}"
          if ($prepareResult -ne 'success' -or $coverageResult -ne 'success' -or $testResult -ne 'success') {
            throw "Matrix result: $prepareResult; coverage evidence result: $coverageResult; preflight/test matrix result: $testResult."
          }
