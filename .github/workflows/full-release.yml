name: Full Signed Release

# The single signed release contract for every app/platform combination.
# Each package job is independently runnable through the app/platform inputs;
# the publish job only assembles the resulting assets under one app/version tag.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        default: all
        type: choice
        options:
          - all
          - FreeX
          - FreeW
          - FreeP
      platform:
        description: Platform lane to run
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      release_version:
        description: Release version, for example 0.8.151
        required: true
        type: string
      prerelease:
        description: Mark each app release as a prerelease
        required: true
        default: true
        type: boolean
      macos_unsigned:
        description: >-
          Build UNSIGNED macOS packages when no Developer ID secrets are configured. Gatekeeper
          refuses to open unsigned bundles by double-click, and the release notes say so.
        required: false
        default: false
        type: boolean
      dry_run:
        description: >-
          Build and validate every package but publish nothing. The weekly packaging rehearsal uses
          this so the packaging path cannot rot unnoticed between releases.
        required: false
        default: false
        type: boolean
      early_abort:
        description: >-
          Stop the whole run as soon as one job fails for a real (non-infrastructure) reason, so a
          red release does not keep burning runner minutes on work that cannot change the outcome.
          The run then ends as Cancelled; the failed job and its error stay visible and nothing is
          published. Turn this off to let every job finish.
        required: false
        default: true
        type: boolean
      source_sha:
        description: >-
          Optional full 40-character lowercase commit SHA to release instead of the dispatched main
          head. It must be an ancestor of (or equal to) the dispatched main head. The release is
          built, packaged and tagged at THIS commit, and the release-only test gates are skipped
          only when a fully green release-readiness run on exactly this commit is found (otherwise
          every gate runs against it). Leave empty to release the dispatched head. Find a value with
          tools/Get-LatestReadinessGreenSha.ps1.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # A version owns one immutable set of app and suite tags. Serialize every
  # app/platform selection for that version so partial dispatches cannot race.
  group: full-signed-release-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  # The commit this run builds, packages, tags and attests. Empty source_sha (the default) is the
  # dispatched head. A non-empty one is validated by the candidate job BEFORE any package or test
  # job runs (they all need it), and every other job consumes only this variable.
  RELEASE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # This workflow runs the same per-project test gates as ci.yml through Invoke-TestGate.ps1, so it
  # needs the same mitigation. Without it the generated-docs preflight -- which shells out and
  # builds the documentation generators -- hung to its timeout on the FIRST attempt of every
  # release and only passed on the gate retry: 15.8, 14.6 and 29.6 minutes for that one job across
  # three consecutive releases, against 8.0 minutes in release-readiness.yml, which sets this.
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  prepare:
    name: Select release lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      suite_matrix: ${{ steps.select.outputs.suite_matrix }}
      publish_matrix: ${{ steps.select.outputs.publish_matrix }}
      release_matrix: ${{ steps.release_tests.outputs.matrix }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select requested app and platform lanes
        id: select
        shell: pwsh
        run: |
          $appInput = "${{ inputs.app }}"
          $platformInput = "${{ inputs.platform }}"
          $apps = if ($appInput -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @($appInput) }
          $platforms = if ($platformInput -eq "all") { @("windows", "linux", "macos") } else { @($platformInput) }
          # costHintMinutes is the longest observed run of that lane across releases 34211267805 and
          # 34218491134. It only decides DISPATCH ORDER, never behaviour: GitHub starts matrix jobs
          # roughly in the order given, and the runner pools are small (macOS peaked at 4 concurrent
          # in the last release, for ten macOS jobs). Listing the lanes app-major, as they were,
          # dispatched the single longest macOS job -- FreeP osx-x64 at 8.5 minutes -- LAST, so it
          # queued 12.5 minutes, finished at 21.9, and every suite job waits on the slowest package.
          # Longest-first is the same rule Get-TestGateMatrix.ps1 already applies to the test matrix.
          $lanes = @(
            @{ app = "FreeX"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest"; costHintMinutes = 19 },
            @{ app = "FreeP"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest"; costHintMinutes = 10 },
            @{ app = "FreeW"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest"; costHintMinutes = 9 },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel"; costHintMinutes = 9 },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel"; costHintMinutes = 7 },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel"; costHintMinutes = 6 },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15"; costHintMinutes = 4 },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest"; costHintMinutes = 3 },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15"; costHintMinutes = 3 },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm"; costHintMinutes = 3 },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15"; costHintMinutes = 3 },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest"; costHintMinutes = 3 },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm"; costHintMinutes = 3 },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest"; costHintMinutes = 3 },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm"; costHintMinutes = 2 }
          )
          $selectedLanes = @($lanes | Where-Object { $_.app -in $apps -and $_.platform -in $platforms })
          if ($selectedLanes.Count -eq 0) { throw "No release lanes were selected." }
          $suiteLanes = @(
            $lanes |
              Where-Object { $_.platform -in $platforms } |
              Group-Object runtime |
              ForEach-Object {
                $lane = $_.Group[0]
                @{ platform = $lane.platform; runtime = $lane.runtime; runner = $lane.runner }
              }
          )

          # The hint has done its job once the order is fixed; it must not reach the matrix, where
          # every key becomes a job variable.
          $orderedLanes = @($selectedLanes | ForEach-Object {
            @{ app = $_.app; platform = $_.platform; runtime = $_.runtime; runner = $_.runner }
          })
          $packageMatrix = @{ include = $orderedLanes } | ConvertTo-Json -Compress
          $suiteMatrix = @{ include = $suiteLanes } | ConvertTo-Json -Compress
          $publishMatrix = @{ app = $apps } | ConvertTo-Json -Compress
          "package_matrix=$packageMatrix" >> $env:GITHUB_OUTPUT
          "suite_matrix=$suiteMatrix" >> $env:GITHUB_OUTPUT
          "publish_matrix=$publishMatrix" >> $env:GITHUB_OUTPUT

      - name: Select full release-only test matrix
        id: release_tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-TestGateMatrix.ps1 -Gate release -GitHubOutputPath $env:GITHUB_OUTPUT

  publish-permission:
    # Deliberately first and deliberately cheap. Every other job in this workflow runs happily
    # without write access, so without this the run learns it cannot publish only after packaging
    # everything -- which is how 0.8.187 burned forty minutes and twelve approvals before failing
    # four times on POST /releases with "Resource not accessible by integration".
    name: Verify this run can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Must match the publish jobs: a job's permissions can only reduce what the repository grants,
      # so asking for write HERE is what makes the probe representative of what publish will get.
      contents: write
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create and delete a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File tools/Test-GitHubReleasePublishPermission.ps1 -Repository "${{ github.repository }}"

  candidate:
    name: Verify immutable release candidate
    needs: [prepare, publish-permission]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      # Only the literal string 'true' lets release-tests be skipped; empty or anything else runs them.
      gate_evidence_reuse: ${{ steps.gate_evidence.outputs.reuse }}
      gate_evidence_run_id: ${{ steps.gate_evidence.outputs.evidence_run_id }}
    steps:
      # Checks out the release commit itself (RELEASE_SHA), so the evidence lookup below reads THAT
      # commit's own gate manifest. A source_sha release needs full history for the ancestry proof.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: ${{ inputs.source_sha != '' && 0 || 1 }}
          persist-credentials: false

      - name: Validate latest release source
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $allowedTagRefs = @($apps | ForEach-Object { "refs/tags/$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $allowedTagRefs += "refs/tags/free-suite-v$version" }

          $isMainRelease = $env:GITHUB_REF -eq "refs/heads/main"
          $isTaggedContinuation = $allowedTagRefs -ccontains $env:GITHUB_REF
          if (-not ($isMainRelease -or $isTaggedContinuation)) {
            throw "Full app releases must start from refs/heads/main or continue from an immutable tag for the requested version."
          }

          # source_sha: release an older, already readiness-proven commit of main. The value only ever
          # reaches this script through the RELEASE_SHA environment variable, never through script text.
          if ($env:RELEASE_SHA -cne $env:GITHUB_SHA) {
            if (-not $isMainRelease) {
              throw "source_sha is only allowed on a dispatch from refs/heads/main; a tag continuation must release the tagged commit."
            }
            if ($env:RELEASE_SHA -cnotmatch '^[0-9a-f]{40}$') {
              throw "source_sha must be a full 40-character lowercase commit SHA."
            }
            git cat-file -e "$($env:RELEASE_SHA)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "source_sha $env:RELEASE_SHA is not a commit of this repository." }
            git merge-base --is-ancestor $env:RELEASE_SHA $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "source_sha $env:RELEASE_SHA is not an ancestor of the dispatched main head $env:GITHUB_SHA; refusing to release a commit that is not on main."
            }
            Write-Host "Releasing the readiness-proven ancestor $env:RELEASE_SHA of main head $env:GITHUB_SHA (source_sha)."
          }
          Write-Host "Pinned immutable release candidate $env:RELEASE_SHA from $env:GITHUB_REF. Later main commits do not invalidate this run."

      # Fail in seconds on a missing prerequisite rather than ~30 minutes in. Releasing 0.8.187 ran
      # the entire release test matrix and every package build before the macOS lanes died on an
      # absent MACOS_CODESIGN_CERTIFICATE_P12 -- and that had silently cost every earlier macOS
      # release too, which is why 0.8.186 shipped with no macOS assets at all.
      - name: Verify signing prerequisites for the requested platforms
        shell: pwsh
        env:
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          $platform = "${{ inputs.platform }}"
          if ($platform -ne "all" -and $platform -ne "macos") {
            Write-Host "macOS lanes are not part of this release; skipping the Developer ID check."
            return
          }

          $required = @(
            "MACOS_CODESIGN_CERTIFICATE_P12",
            "MACOS_CODESIGN_CERTIFICATE_PASSWORD",
            "MACOS_DEVELOPER_ID_APPLICATION",
            "MACOS_NOTARY_APPLE_ID",
            "MACOS_NOTARY_TEAM_ID",
            "MACOS_NOTARY_PASSWORD"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          $unsigned = "${{ inputs.macos_unsigned }}" -eq "true"

          if ($missing.Count -eq 0) {
            Write-Host "All six Developer ID secrets are present; macOS packages will be signed and notarized."
            if ($unsigned) {
              throw ("macos_unsigned was requested but every Developer ID secret is configured. Refusing " +
                "to publish deliberately unsigned macOS artifacts when they could be signed; re-run " +
                "with macos_unsigned disabled.")
            }
            return
          }

          if (-not $unsigned) {
            throw ("macOS packaging cannot be signed: $($missing.Count) of $($required.Count) Developer ID " +
              "secret(s) are not configured ($($missing -join ', ')). Add them to the repository secrets, " +
              "or re-run with macos_unsigned enabled to publish unsigned macOS builds that Gatekeeper " +
              "will refuse to open by double-click.")
          }

          if ($missing.Count -ne $required.Count) {
            throw ("Refusing to build unsigned macOS packages from a partial signing configuration. " +
              "Missing: $($missing -join ', '). Supply all six Developer ID secrets, or none of them.")
          }

          Write-Warning ("No Developer ID secrets are configured and macos_unsigned was requested, so this " +
            "release will publish UNSIGNED macOS packages.")

      - name: Validate version and reject conflicting immutable tags
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "release_version must be a filesystem-safe semantic version such as 0.8.182."
          }
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $tags = @($apps | ForEach-Object { "$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $tags += "free-suite-v$version" }
          foreach ($tag in $tags) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
            if ($remoteRefs.Count -eq 0) { continue }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "\`t")[0]
            if ($tagSha -cne $env:RELEASE_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; choose a new version before running full release tests."
            }
          }

      # The Windows signing script validates this same file, but only after the Windows package has
      # spent ~15 minutes building the payload it is about to sign. The check needs no secret and no
      # Windows, so a bad Account URI, a placeholder or a retargeted account fails in seconds here.
      # Keep it in step with tools/Invoke-WindowsArtifactSigning.ps1 (a source-contract test pins both).
      - name: Verify the Artifact Signing metadata before any package is built
        if: ${{ !inputs.dry_run && (inputs.platform == 'all' || inputs.platform == 'windows') }}
        shell: pwsh
        run: |
          $path = "tools/signing/metadata.json"
          $metadata = Get-Content -LiteralPath $path -Raw -ErrorAction Stop | ConvertFrom-Json
          foreach ($name in @("Endpoint", "CodeSigningAccountName", "CertificateProfileName")) {
            if (-not $metadata.PSObject.Properties[$name] -or [string]::IsNullOrWhiteSpace([string]$metadata.$name)) {
              throw "Artifact Signing metadata is missing '$name': $path"
            }
          }
          if ([string]$metadata.Endpoint -match 'REPLACE-WITH|<|>') { throw "Replace the Endpoint placeholder in '$path' with the exact Account URI from Azure Artifact Signing." }
          if ([string]$metadata.Endpoint -notmatch '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$') { throw "Artifact Signing Endpoint must be an https://<region>.codesigning.azure.net Account URI." }
          if ([string]$metadata.CodeSigningAccountName -ne "free-software-signing" -or [string]$metadata.CertificateProfileName -ne "freevia-public-signing") {
            throw "Artifact Signing metadata must target free-software-signing/freevia-public-signing."
          }
          Write-Host "Artifact Signing metadata targets $($metadata.CodeSigningAccountName)/$($metadata.CertificateProfileName)."

      # Requiring CI and CodeQL attestations on the EXACT dispatch head is unsatisfiable here: main
      # takes ~a commit a minute from parallel sessions and codeql.yml (cancel-in-progress, ~10min)
      # is usually cancelled by the next push, so the head a release dispatches from is almost never
      # attested. Three consecutive release attempts were rejected for that reason alone.
      #
      # Resolve-GitHubReleaseCandidate.ps1 keeps the attestation itself unchanged -- it still calls
      # tools/Test-GitHubReleaseCandidate.ps1, which demands a completed successful run of every
      # required workflow -- but applies it to the newest ANCESTOR of the head that qualifies, and
      # reports how many commits ship without a green run of their own.
      - name: Require successful CI and CodeQL attestations
        id: attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File tools/Resolve-GitHubReleaseCandidate.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:RELEASE_SHA

      # release-readiness.yml runs the same release-only gates on a schedule. If a readiness run
      # already proved ALL of them on EXACTLY this commit (fresh, every expected job present once and
      # green), re-running them here adds nothing. Anything short of that -- no run, an ancestor's run,
      # a missing or red gate, an old run, any lookup error -- reports reuse=false and release-tests
      # runs every gate. The script never fails the job and never turns an error into a skip.
      - name: Look for release-gate evidence on this exact commit
        id: gate_evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File tools/Resolve-ReleaseGateEvidence.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:RELEASE_SHA `
            -GitHubOutputPath $env:GITHUB_OUTPUT

  early-abort:
    # A release that is going to fail should fail in minutes, not after the other forty. Packaging
    # and the release tests run side by side, so a regression found by a five-minute test used to
    # leave about a hundred runner-minutes of packaging running to no purpose (release 44725827772
    # kept two Windows and several macOS jobs going after its first render-evidence failure).
    #
    # GitHub cannot cancel one job, only the run, so this watcher cancels the run -- but only for a
    # REAL failure as tools/Get-ReleaseRunFailureClass.ps1 defines it. An infrastructure failure
    # (lost runner, never-acquired macOS runner) must not abort a healthy release; it is left for
    # the single automatic re-run in release-auto-retry.yml.
    #
    # Failing closed: nothing needs this job, a cancelled run can never publish (publication-gate
    # requires every upstream job to have succeeded), and a watcher that errors is ignored rather
    # than turning a healthy release red.
    name: Watch for a real failure and stop the run early
    needs: [candidate]
    if: ${{ inputs.early_abort }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout the classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/Get-ReleaseRunFailureClass.ps1
          sparse-checkout-cone-mode: false
      - name: Cancel the run on the first real failure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = [datetime]::UtcNow.AddMinutes(235)
          $lookupFailures = 0
          while ([datetime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 20
            try {
              $json = pwsh -NoProfile -File tools/Get-ReleaseRunFailureClass.ps1 -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID
              if ($LASTEXITCODE -ne 0) { throw "classifier exited with $LASTEXITCODE" }
              $state = ($json -join "`n") | ConvertFrom-Json
              $lookupFailures = 0
            }
            catch {
              $lookupFailures++
              Write-Warning "Could not read the run state ($lookupFailures): $($_.Exception.Message)"
              continue
            }

            if ($state.reachedPublicationGate) {
              Write-Host "Every test and package job has finished without a real failure; nothing left to watch."
              return
            }
            if (-not $state.hasRealFailure) { continue }

            $first = [string]$state.firstRealFailure
            Write-Host "::error title=Release stopped early::First real failure -- $first. Cancelling the remaining jobs so they stop burning runner minutes. Nothing is published."
            "### Release stopped early`nFirst real failure: **$first**`n`nThe other jobs were cancelled because they could not change the outcome. Fix the failure above and re-run; this run publishes nothing." >> $env:GITHUB_STEP_SUMMARY
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh run cancel $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (5 * $attempt)
            }
            # The cancellation reaches this job too; waiting keeps the log honest until it does.
            Start-Sleep -Seconds 120
            return
          }
          Write-Warning "The watcher reached its own time limit without seeing the publication gate; it stops watching."

  release-tests:
    name: Release test ${{ matrix.app }} ${{ matrix.platform }} ${{ matrix.displayGateId }}
    needs: [prepare, candidate]
    # A dry run (including the weekly packaging rehearsal) rehearses PACKAGING and publishes nothing,
    # so re-running the fifteen release-only test gates there only burns ~97 runner-minutes and holds
    # macOS slots that the macOS package legs then queue for (FreeW osx-x64 waited 4.9 minutes for
    # one). release-readiness.yml already covers those gates on a schedule. A real release never
    # skips them unless a readiness run proved every gate on this exact commit (candidate's
    # gate_evidence_reuse): release-gate below accepts 'skipped' only for one of those two reasons.
    if: ${{ !inputs.dry_run && needs.candidate.outputs.gate_evidence_reuse != 'true' }}
    runs-on: ${{ matrix.runner }}
    # The slowest leg observed is under ten minutes and Invoke-TestGate already enforces a 30-minute
    # hang timeout per test project, so an hour is generous; two hours let a wedged runner idle.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: ${{ matrix.fetchDepth }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-

      # ci.yml and release-readiness.yml both cache obj across runs; this workflow never did, so every
      # release test job rebuilt the world from scratch. Caching is confined to the TEST lane on
      # purpose: the package jobs produce the artifacts we ship, and those keep building clean.
      #
      # Its own key namespace, because these are different gate ids building different project sets;
      # sharing ci.yml's keys would make each lane evict the other's entries.
      - name: Restore build output cache
        id: buildcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/obj
            obj-build-cache-commit.txt
          key: release-v2-${{ runner.os }}-${{ matrix.displayGateId }}-${{ env.RELEASE_SHA }}
          restore-keys: release-v2-${{ runner.os }}-${{ matrix.displayGateId }}-
      - name: Make build-cache timestamps honest
        shell: pwsh
        run: pwsh -NoProfile -File tools/Set-BuildCacheTimestamps.ps1
      - name: Record the commit this cache will hold
        shell: pwsh
        run: '"${{ env.RELEASE_SHA }}" | Set-Content -LiteralPath obj-build-cache-commit.txt -Encoding ascii'
      - name: Run isolated release test gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate release `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -GateId "${{ matrix.gateId }}" `
            -PartitionIndex ${{ matrix.partitionIndex }} `
            -PartitionCount ${{ matrix.partitionCount }} `
            -RetryFailedProjectCount 1 `
            -HangTimeout 30m `
            -ResultsDirectory TestResults
      # Only save a coherent tree: a job that died midway leaves a partial obj/, and restoring one
      # fails outright with "CSC : error CS2012 ... Could not find a part of the path".
      - name: Save build output cache
        if: success() && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/obj
            obj-build-cache-commit.txt
          key: release-v2-${{ runner.os }}-${{ matrix.displayGateId }}-${{ env.RELEASE_SHA }}
      - name: Upload release test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tests-${{ matrix.platform }}-${{ matrix.displayGateId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    name: FreeX full release gate
    needs: [prepare, candidate, release-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate immutable-candidate coverage
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $candidateResult = "${{ needs.candidate.result }}"
          $releaseTestResult = "${{ needs.release-tests.result }}"
          # 'skipped' is acceptable for exactly two reasons. A dry run publishes nothing (publish and
          # publish-suite are gated on !inputs.dry_run). Or the candidate job found a successful
          # release-readiness run that proved every expected release gate on this exact commit. A real
          # release otherwise needs a green result from every release test, so a skipped, cancelled or
          # failed one still fails the gate.
          $isDryRun = "${{ inputs.dry_run }}" -eq 'true'
          $evidenceReused = "${{ needs.candidate.outputs.gate_evidence_reuse }}" -eq 'true'
          if ($evidenceReused) {
            Write-Host "Release-only gates were verified from release-readiness run ${{ needs.candidate.outputs.gate_evidence_run_id }} on this exact commit."
          }
          $releaseTestsAcceptable = $releaseTestResult -eq 'success' -or (($isDryRun -or $evidenceReused) -and $releaseTestResult -eq 'skipped')
          if ($prepareResult -ne 'success' -or $candidateResult -ne 'success' -or -not $releaseTestsAcceptable) {
            throw "Preparation: $prepareResult; exact-SHA integration attestations: $candidateResult; release-only tests: $releaseTestResult."
          }

  package:
    name: Package ${{ matrix.app }} ${{ matrix.runtime }}
    # Packaging is immutable-candidate work and can overlap release-only tests. Publication still
    # waits for release-gate, so a failed test can never publish the speculative package artifacts.
    needs: [prepare, candidate]
    runs-on: ${{ matrix.runner }}
    # A dry run publishes nothing and signs nothing, so it needs neither the approval gate nor the Azure
    # federated credential (both of which belong to PUBLISHING). The expression is written with the
    # non-empty value on the TRUE side because an empty string is falsy in && / || chains. Without this the weekly rehearsal parked
    # at the gate forever and exercised nothing past the tests.
    # Only Windows legs sign, and only the public-preview environment holds the AZURE_* values and the
    # Azure federated subject (environment:public-preview). Linux and macOS legs sign nothing through
    # Azure, so they run without the approval gate and start immediately. Publication stays behind the
    # publication-gate and the public-preview environment on the publish job.
    environment: ${{ !inputs.dry_run && matrix.platform == 'windows' && 'public-preview' || '' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Every lane starts at once; the runner pools (macOS 5, Linux 5, ~20 aggregate) do the queueing,
      # and the matrix is ordered longest-first so the short lanes absorb it. This used to be 5, which
      # was meant to leave the fifteen release-test entries their runners -- but those are already
      # running (or the package jobs are parked at the public-preview approval, which a person grants
      # after the tests have mostly finished) before any package slot matters. In release 43047602424
      # it serialized fifteen jobs through five slots: FreeW osx-x64 waited 7 minutes for a slot, and
      # the last package finished 18 minutes after the first started, against a 16 minute longest job.
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-

      - name: Cache pinned SBOM tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/sbom-tool
          key: sbom-tool-${{ runner.os }}-${{ runner.arch }}-4.1.5

      - name: Authenticate to Azure Artifact Signing
        if: matrix.platform == 'windows' && !inputs.dry_run
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        if: matrix.platform == 'windows' && !inputs.dry_run
        shell: pwsh
        run: |
          . tools/Invoke-WithRetry.ps1
          # 'update --version' installs the exact pinned version when absent and is safe to repeat,
          # unlike 'install', which would fail every retry after a half-completed first attempt.
          Invoke-WithRetry -Description "Installing the pinned Velopack signing client bundle" -Action { dotnet tool update --global vpk --version 1.2.0 }
          Invoke-WithRetry -Description "Obtaining an Artifact Signing access token for the GitHub OIDC identity" -Action { az account get-access-token --resource https://codesigning.azure.net --output none }

      - name: Publish self-contained tester package
        shell: pwsh
        env:
          # Optional public ingestion identifier embedded as assembly metadata.
          # An absent value keeps diagnostics local and does not block packaging.
          FreeFamilySentryDsn: ${{ secrets.FREE_FAMILY_SENTRY_DSN }}
          FreeFamilySentryEnvironment: tester-release
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match "[`r`n]") {
            throw "release_version must be a non-empty single line."
          }

          if ("${{ matrix.platform }}" -eq "windows") {
            $signing = @{}
            if ("${{ inputs.dry_run }}" -ne "true") { $signing.ArtifactSigningMetadataPath = "tools\signing\metadata.json" }
            tools/Publish-WindowsVelopackPackage.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -RuntimeIdentifier "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts\release `
              @signing
          } elseif ("${{ matrix.platform }}" -eq "linux") {
            tools/Publish-SisterAppTesterPackages.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -Runtimes "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts\release
            tools/packaging/New-AppInstallers.ps1 `
              -Apps "${{ matrix.app }}" `
              -Platform linux `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot artifacts\release `
              -OutputDir artifacts\release
          } else {
            tools/Publish-SisterAppTesterPackages.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -Runtimes "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts/release
            tools/packaging/New-SignedMacOsReleasePackages.ps1 `
              -Apps "${{ matrix.app }}" `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot artifacts/release `
              -OutputDir artifacts/release ${{ inputs.macos_unsigned && '-AllowUnsigned' || '' }}
          }

          tools/Test-ReleasePackageContents.ps1 `
            -Scope App `
            -Apps "${{ matrix.app }}" `
            -Version $version `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts\release `
            ${{ inputs.dry_run && '-SkipWindowsSignatureCheck' || '' }}

      - name: Generate SBOM and validate package inventory
        shell: pwsh
        run: |
          $app = "${{ matrix.app }}"
          $version = "${{ inputs.release_version }}"
          $runtime = "${{ matrix.runtime }}"
          $prefix = "$app-v$version-$runtime"
          $payloadNames = if ($runtime -like "win-*") {
            @("$prefix.exe", "$prefix-setup.exe")
          } elseif ($runtime -like "linux-*") {
            @("$prefix.zip", "$prefix-installer.zip")
          } else {
            @("$prefix.zip", "$prefix-apps.zip")
          }
          $sbomTool = if ($IsWindows) { "artifacts/sbom-tool/sbom-tool.exe" } else { "artifacts/sbom-tool/sbom-tool" }
          if (-not (Test-Path -LiteralPath $sbomTool -PathType Leaf)) {
            . tools/Invoke-WithRetry.ps1
            Invoke-WithRetry -Description "Installing Microsoft.Sbom.DotNetTool 4.1.5" -Action { dotnet tool update --tool-path artifacts/sbom-tool Microsoft.Sbom.DotNetTool --version 4.1.5 }
          }
          tools/New-ReleaseSbom.ps1 `
            -Name $app `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtime $runtime `
            -InputRoot artifacts/release `
            -PayloadNames $payloadNames `
            -OutputPath "artifacts/release/$prefix.spdx.json" `
            -SbomToolPath $sbomTool
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope App `
            -Apps $app `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtimes $runtime `
            -InputRoot artifacts/release `
            -OutputPath "artifacts/release/$prefix-manifest.json"

      - name: Install and uninstall individual package
        shell: pwsh
        run: |
          tools/Test-ReleaseInstallation.ps1 `
            -Platform "${{ matrix.platform }}" `
            -Apps "${{ matrix.app }}" `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts/release

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tester-${{ matrix.app }}-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: |
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}.*
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}-*
            artifacts/release/velopack-${{ matrix.app }}-${{ matrix.runtime }}/**
          if-no-files-found: error
          retention-days: 14

  suite-package:
    name: Package Free Suite ${{ matrix.runtime }}
    needs: [prepare, package]
    if: inputs.app == 'all'
    runs-on: ${{ matrix.runner }}
    # A dry run publishes nothing and signs nothing, so it needs neither the approval gate nor the Azure
    # federated credential (both of which belong to PUBLISHING). The expression is written with the
    # non-empty value on the TRUE side because an empty string is falsy in && / || chains. Without this the weekly rehearsal parked
    # at the gate forever and exercised nothing past the tests.
    # Only Windows legs sign, and only the public-preview environment holds the AZURE_* values and the
    # Azure federated subject (environment:public-preview). Linux and macOS legs sign nothing through
    # Azure, so they run without the approval gate and start immediately. Publication stays behind the
    # publication-gate and the public-preview environment on the publish job.
    environment: ${{ !inputs.dry_run && matrix.platform == 'windows' && 'public-preview' || '' }}
    # Suite legs only repackage already-built artifacts (observed 1-4 minutes), so a wedged one must
    # not hold the run for two hours.
    timeout-minutes: 30
    permissions:
      # The artifact-download fallback lists this run's artifacts through gh.
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.suite_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download portable app packages
        id: download_portable
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-*-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: downloaded-artifacts
          merge-multiple: false

      # actions/download-artifact retries only inside its own step, over a few seconds,
      # against the same service. Release 0.8.187 lost three Free Suite jobs to
      # "Artifact download failed after 5 retries" during a GitHub artifact-service blip and
      # threw away forty minutes of completed packaging. This is the outer loop it lacks.
      - name: Recover from a transient artifact-service failure
        if: steps.download_portable.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pwsh -NoProfile -File tools/Get-GitHubRunArtifact.ps1
          -Repository "${{ github.repository }}"
          -RunId "${{ github.run_id }}"
          -Pattern "tester-*-${{ inputs.release_version }}-${{ matrix.runtime }}"
          -Destination downloaded-artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache pinned SBOM tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/sbom-tool
          key: sbom-tool-${{ runner.os }}-${{ runner.arch }}-4.1.5

      - name: Validate downloaded app packages
        shell: pwsh
        run: |
          foreach ($app in @("FreeX", "FreeW", "FreeP")) {
            tools/New-ReleaseArtifactManifest.ps1 `
              -Scope App `
              -Apps $app `
              -Version "${{ inputs.release_version }}" `
              -CommitSha $env:RELEASE_SHA `
              -Runtimes "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputPath "artifacts/precheck/$app-v${{ inputs.release_version }}-${{ matrix.runtime }}-validated.json" `
              -RequireSourceManifests
          }

      - name: Authenticate to Azure Artifact Signing
        if: matrix.platform == 'windows' && !inputs.dry_run
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        if: matrix.platform == 'windows' && !inputs.dry_run
        shell: pwsh
        run: |
          . tools/Invoke-WithRetry.ps1
          Invoke-WithRetry -Description "Installing the pinned Artifact Signing client bundle" -Action { dotnet tool update --global vpk --version 1.2.0 }
          Invoke-WithRetry -Description "Obtaining an Artifact Signing access token for the GitHub OIDC identity" -Action { az account get-access-token --resource https://codesigning.azure.net --output none }

      - name: Build signed suite installer
        shell: pwsh
        env:
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          $version = "${{ inputs.release_version }}"
          $platform = "${{ matrix.platform }}"
          if ($platform -eq "windows") {
            $suite = tools/packaging/New-FreeSuiteWindowsBootstrapper.ps1 `
              -Version $version `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite
            if ("${{ inputs.dry_run }}" -ne "true") {
              tools/Invoke-WindowsArtifactSigning.ps1 `
                -Files $suite `
                -MetadataPath tools/signing/metadata.json
            }
            $name = Split-Path -Leaf $suite
            $hash = (Get-FileHash -LiteralPath $suite -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$suite.sha256" -NoNewline -Encoding ascii
          } elseif ($platform -eq "linux") {
            tools/packaging/New-AppInstallers.ps1 `
              -Apps FreeX,FreeW,FreeP `
              -Suite `
              -Platform linux `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite
          } else {
            tools/packaging/New-SignedMacOsReleasePackages.ps1 `
              -Apps FreeX,FreeW,FreeP `
              -Suite `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite ${{ inputs.macos_unsigned && '-AllowUnsigned' || '' }}
          }

          tools/Test-ReleasePackageContents.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts\suite ${{ inputs.macos_unsigned && '-AllowUnsigned' || '' }} `
            ${{ inputs.dry_run && '-SkipWindowsSignatureCheck' || '' }}

      - name: Generate suite SBOM and validate inventory
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}"
          $runtime = "${{ matrix.runtime }}"
          $prefix = "FreeSuite-v$version-$runtime"
          $payloadName = if ($runtime -like "win-*") { "$prefix-setup.exe" } elseif ($runtime -like "linux-*") { "$prefix-installer.zip" } else { "$prefix.pkg" }
          Get-ChildItem -LiteralPath downloaded-artifacts -Recurse -File -Filter "*-v$version-$runtime-manifest.json" |
            Copy-Item -Destination artifacts/suite
          $sbomTool = if ($IsWindows) { "artifacts/sbom-tool/sbom-tool.exe" } else { "artifacts/sbom-tool/sbom-tool" }
          if (-not (Test-Path -LiteralPath $sbomTool -PathType Leaf)) {
            . tools/Invoke-WithRetry.ps1
            Invoke-WithRetry -Description "Installing Microsoft.Sbom.DotNetTool 4.1.5" -Action { dotnet tool update --tool-path artifacts/sbom-tool Microsoft.Sbom.DotNetTool --version 4.1.5 }
          }
          tools/New-ReleaseSbom.ps1 `
            -Name FreeSuite `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtime $runtime `
            -InputRoot artifacts/suite `
            -PayloadNames $payloadName `
            -OutputPath "artifacts/suite/$prefix.spdx.json" `
            -SbomToolPath $sbomTool
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtimes $runtime `
            -InputRoot artifacts/suite `
            -OutputPath "artifacts/suite/$prefix-manifest.json" `
            -RequireSourceManifests

      - name: Install, transition, and uninstall suite package
        shell: pwsh
        run: |
          tools/Test-ReleaseInstallation.ps1 `
            -Platform "${{ matrix.platform }}" `
            -Apps FreeX,FreeW,FreeP `
            -Suite `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot .

      - name: Require a suite installer payload before uploading
        shell: pwsh
        run: |
          # if-no-files-found: error cannot catch a missing installer here, because the manifests and
          # the SBOM always match the upload glob. That is how 0.8.187 uploaded a metadata-only macOS
          # suite artifact that looked healthy for another thirty minutes and then failed at publish.
          $root = "artifacts/suite"
          $prefix = "FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}"
          $payloadExtensions = @(".pkg", ".zip", ".exe", ".deb", ".rpm")
          $installers = @(Get-ChildItem -LiteralPath $root -File |
            Where-Object {
              $_.Name.StartsWith($prefix) -and
              ($payloadExtensions -contains $_.Extension) -and
              -not $_.Name.EndsWith(".sha256")
            })
          if ($installers.Count -eq 0) {
            $present = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object { $_.Name })
            throw ("No Free Suite installer payload was produced for ${{ matrix.runtime }}. Uploading " +
              "now would publish a metadata-only artifact that only fails at the publish step. " +
              "Found in ${root}: " + ($present -join ", "))
          }
          Write-Host "Suite payload present: $($installers.Name -join ', ')"

      # The glob deliberately has no hyphen after the runtime. Linux and Windows name their
      # installer ...-<runtime>-installer.zip / -setup.exe, but macOS produces
      # FreeSuite-v<version>-<runtime>.pkg, which a ...-<runtime>-* glob does not match. The
      # suite .pkg was therefore built, validated and even installed, then silently left out of
      # the artifact -- if-no-files-found stayed quiet because the manifests still matched -- so
      # publishing 0.8.187 failed at the very end looking for a file nothing had uploaded.
      - name: Upload suite installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tester-FreeSuite-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: |
            artifacts/suite/FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}*
            artifacts/suite/FreeX-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
            artifacts/suite/FreeW-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
            artifacts/suite/FreeP-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
          if-no-files-found: error
          retention-days: 14

  publication-gate:
    name: Validate complete release inventory
    needs: [prepare, release-gate, package, suite-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require every selected package before publication
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $releaseGateResult = "${{ needs.release-gate.result }}"
          $packageResult = "${{ needs.package.result }}"
          $suiteResult = "${{ needs.suite-package.result }}"
          $requiresSuite = "${{ inputs.app }}" -eq "all"
          if ($prepareResult -ne 'success' -or $releaseGateResult -ne 'success' -or $packageResult -ne 'success') {
            throw "Preparation: $prepareResult; release tests: $releaseGateResult; app packages: $packageResult."
          }
          if ($requiresSuite -and $suiteResult -ne 'success') {
            throw "Full-suite packaging must succeed before any release is published; result: $suiteResult."
          }
          if (-not $requiresSuite -and $suiteResult -notin @('skipped', 'success')) {
            throw "Unexpected suite packaging result for an app-only release: $suiteResult."
          }

      - name: Checkout immutable tag context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject every conflicting release tag before the first publication
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $tags = @($apps | ForEach-Object { "$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $tags += "free-suite-v$version" }
          foreach ($tag in $tags) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
            if ($remoteRefs.Count -eq 0) { continue }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:RELEASE_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing publication from $env:RELEASE_SHA."
            }
          }

  publish:
    name: Publish ${{ matrix.app }} release
    needs: [prepare, publication-gate]
    # A dry run rehearses packaging only; nothing is tagged or published.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: public-preview
    timeout-minutes: 20
    permissions:
      # The artifact-download fallback lists this run's artifacts through gh.
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.publish_matrix) }}
    steps:
      - name: Checkout release context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download selected app packages
        id: download_app
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-${{ matrix.app }}-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: false

      # actions/download-artifact retries only inside its own step, over a few seconds,
      # against the same service. Release 0.8.187 lost three Free Suite jobs to
      # "Artifact download failed after 5 retries" during a GitHub artifact-service blip and
      # threw away forty minutes of completed packaging. This is the outer loop it lacks.
      - name: Recover from a transient artifact-service failure
        if: steps.download_app.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pwsh -NoProfile -File tools/Get-GitHubRunArtifact.ps1
          -Repository "${{ github.repository }}"
          -RunId "${{ github.run_id }}"
          -Pattern "tester-${{ matrix.app }}-${{ inputs.release_version }}-*"
          -Destination downloaded-artifacts

      - name: Create or update signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = "${{ matrix.app }}"
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "$($app.ToLowerInvariant())-v$version"
          $title = "$app v$version"
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null

          Get-ChildItem -LiteralPath "downloaded-artifacts" -Recurse -File |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $assetRoot $_.Name) -Force
            }

          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope App `
            -Apps $app `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtimes $runtimes `
            -InputRoot $assetRoot `
            -OutputPath (Join-Path $assetRoot "$app-v$version-release-manifest.json") `
            -RequireRuntimeManifests `
            -StageLegalBundle

          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No $app release assets were downloaded."
          }

          $notes = @'
          # {{APP}} v{{VERSION}}

          Assets are built independently for each selected platform from commit {{SHA}}.

          ## Install and deploy

          ### Windows x64

          1. Download `{{APP}}-v{{VERSION}}-win-x64.exe` and its `.sha256` file.
          2. Verify the download: `Get-FileHash .\{{APP}}-v{{VERSION}}-win-x64.exe -Algorithm SHA256`; compare the hash with the `.sha256` file.
          3. The standalone executable and `-setup.exe` are Authenticode signed by Freevia through Azure Artifact Signing. Use the Velopack setup for an installed, self-updating copy, or run the standalone executable directly.

          ### Linux x64 and ARM64

          1. Choose `linux-x64` for Intel/AMD 64-bit systems or `linux-arm64` for 64-bit ARM systems. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `sha256sum -c {{APP}}-v{{VERSION}}-linux-<architecture>.zip.sha256`.
          3. Extract it into a stable per-user directory, for example `unzip {{APP}}-v{{VERSION}}-linux-<architecture>.zip -d ~/{{APP}}`.
          4. Run `chmod +x ~/{{APP}}/{{APP}}` once, then start it with `~/{{APP}}/{{APP}}`. To update, close the app and replace the extracted directory.

          ### macOS Intel and Apple silicon

          1. Choose `osx-x64` for Intel Macs or `osx-arm64` for Apple silicon. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `shasum -a 256 -c {{APP}}-v{{VERSION}}-osx-<architecture>.zip.sha256`.
          3. Prefer the matching `-apps.zip`; it contains an `.app` bundle that is ${{ inputs.macos_unsigned && 'NOT signed or notarized -- macOS Gatekeeper refuses to open it by double-click; see the bundled README to clear the quarantine attribute' || 'Developer ID signed, notarized, and stapled' }}, plus an install helper.

          Each platform includes a portable artifact and an installable package: signed Velopack `-setup.exe` on Windows, `-installer.zip` on Linux, and `-apps.zip` containing an `.app` bundle on macOS that is ${{ inputs.macos_unsigned && 'NOT signed or notarized' || 'signed, notarized, and stapled' }}. Linux integrity is covered by SHA-256 checksums, manifests, and SPDX SBOMs.
          '@
          $notes = $notes.
            Replace("{{APP}}", $app).
            Replace("{{VERSION}}", $version).
            Replace("{{SHA}}", $env:RELEASE_SHA)

          . tools/Invoke-WithRetry.ps1
          # Only a definite "release not found" means the release does not exist. Any other failure
          # (a service blip) is retried, because misreading it as "absent" would try to CREATE a
          # release that is already there.
          $releaseExists = Invoke-WithRetry -Description "Looking up release '$tag'" -Action {
            $view = gh release view $tag 2>&1
            if ($LASTEXITCODE -eq 0) { $true }
            elseif ("$view" -match 'release not found') { $global:LASTEXITCODE = 0; $false }
            else { throw "gh release view failed: $view" }
          }
          $remoteRefs = @(Invoke-WithRetry -Description "Resolving remote tag '$tag'" -Action { git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" })
          if ($remoteRefs.Count -gt 0) {
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:RELEASE_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing to replace it with assets from $env:RELEASE_SHA. Use a new version."
            }
          } elseif ($releaseExists) {
            throw "Existing release '$tag' has no resolvable remote tag."
          }
          if ($releaseExists) {
            # Resumes a partial publication without silently replacing a published asset: uploads
            # only what is missing, keeps identical assets, and refuses a same-name different-content one.
            & tools/Send-ReleaseAssets.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $tag -AssetPaths $assets
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
            $notes | gh release edit $tag --title $title --notes-file - "--prerelease=$prerelease"
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:RELEASE_SHA --title $title --notes-file - @releaseArgs
          }

  publish-suite:
    name: Publish Free Suite release
    needs: [suite-package, publication-gate]
    if: ${{ !inputs.dry_run && inputs.app == 'all' }}
    runs-on: ubuntu-latest
    environment: public-preview
    timeout-minutes: 20
    permissions:
      # The artifact-download fallback lists this run's artifacts through gh.
      actions: read
      contents: write
    steps:
      - name: Checkout release context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download suite packages
        id: download_suite
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-FreeSuite-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: true

      # actions/download-artifact retries only inside its own step, over a few seconds,
      # against the same service. Release 0.8.187 lost three Free Suite jobs to
      # "Artifact download failed after 5 retries" during a GitHub artifact-service blip and
      # threw away forty minutes of completed packaging. This is the outer loop it lacks.
      - name: Recover from a transient artifact-service failure
        if: steps.download_suite.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pwsh -NoProfile -File tools/Get-GitHubRunArtifact.ps1
          -Repository "${{ github.repository }}"
          -RunId "${{ github.run_id }}"
          -Pattern "tester-FreeSuite-${{ inputs.release_version }}-*"
          -Destination downloaded-artifacts -Flatten

      - name: Create or update suite release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "free-suite-v$version"
          $title = "Free Suite v$version"
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "suite-release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null
          Get-ChildItem -LiteralPath downloaded-artifacts -File | Copy-Item -Destination $assetRoot
          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version $version `
            -CommitSha $env:RELEASE_SHA `
            -Runtimes $runtimes `
            -InputRoot $assetRoot `
            -OutputPath (Join-Path $assetRoot "FreeSuite-v$version-release-manifest.json") `
            -RequireRuntimeManifests `
            -StageLegalBundle
          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No suite packages were downloaded." }
          $notes = @'
          # Free Suite v{{VERSION}}

          This release installs FreeX, FreeW, and FreeP together by invoking the same per-app installers shipped on each app's release page. It does not create separate suite-owned copies, so suite-to-individual upgrades and individual-to-suite upgrades keep the same installation and uninstaller identities. Portable artifacts remain available on the individual release pages.

          Windows uses a Freevia Authenticode-signed .NET bootstrapper containing the three signed Velopack installers; it has no Inno dependency. Linux uses an installer bundle whose `install.sh` defaults to `~/.local`, protected by SHA-256 checksums, manifests, and an SPDX SBOM. macOS uses a `.pkg` containing all three `.app` bundles; it is ${{ inputs.macos_unsigned && 'NOT signed or notarized, so Gatekeeper refuses to open it by double-click' || 'Developer ID Installer-signed, notarized, and stapled' }}.
          '@.Replace("{{VERSION}}", $version)

          . tools/Invoke-WithRetry.ps1
          # Only a definite "release not found" means the release does not exist. Any other failure
          # (a service blip) is retried, because misreading it as "absent" would try to CREATE a
          # release that is already there.
          $releaseExists = Invoke-WithRetry -Description "Looking up release '$tag'" -Action {
            $view = gh release view $tag 2>&1
            if ($LASTEXITCODE -eq 0) { $true }
            elseif ("$view" -match 'release not found') { $global:LASTEXITCODE = 0; $false }
            else { throw "gh release view failed: $view" }
          }
          $remoteRefs = @(Invoke-WithRetry -Description "Resolving remote tag '$tag'" -Action { git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" })
          if ($remoteRefs.Count -gt 0) {
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:RELEASE_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing to replace it with assets from $env:RELEASE_SHA. Use a new version."
            }
          } elseif ($releaseExists) {
            throw "Existing release '$tag' has no resolvable remote tag."
          }
          if ($releaseExists) {
            # Resumes a partial publication without silently replacing a published asset: uploads
            # only what is missing, keeps identical assets, and refuses a same-name different-content one.
            & tools/Send-ReleaseAssets.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $tag -AssetPaths $assets
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
            $notes | gh release edit $tag --title $title --notes-file - "--prerelease=$prerelease"
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:RELEASE_SHA --title $title --notes-file - @releaseArgs
          }

  verify-publication:
    name: Verify published release inventory
    needs: [publish, publish-suite]
    if: ${{ always() && !inputs.dry_run && needs.publish.result == 'success' && (inputs.app != 'all' || needs.publish-suite.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tag verification context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tags, prerelease state, and complete remote assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $expectedPrerelease = "${{ inputs.prerelease }}" -eq "true"
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }

          function Assert-Release([string]$Tag, [string[]]$RequiredAssets) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$Tag" "refs/tags/$Tag^{}")
            if ($LASTEXITCODE -ne 0 -or $remoteRefs.Count -eq 0) { throw "Published tag '$Tag' could not be resolved." }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:RELEASE_SHA) { throw "Published tag '$Tag' targets $tagSha instead of $env:RELEASE_SHA." }

            $release = gh release view $Tag --json isPrerelease,assets,url | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect published release '$Tag'." }
            if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
              throw "Release '$Tag' prerelease state is '$($release.isPrerelease)'; expected '$expectedPrerelease'."
            }
            $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
            $emptyAssets = @($release.assets | Where-Object { [long]$_.size -le 0 } | ForEach-Object { [string]$_.name })
            if ($emptyAssets.Count -gt 0) { throw "Release '$Tag' contains empty assets: $($emptyAssets -join ', ')." }
            $missing = @($RequiredAssets | Where-Object { $_ -notin $assetNames })
            if ($missing.Count -gt 0) { throw "Release '$Tag' is missing assets: $($missing -join ', ')." }
            Write-Host "Verified $Tag at $($release.url) with $($assetNames.Count) non-empty assets."
          }

          foreach ($app in $apps) {
            $required = @("$app-v$version-release-manifest.json")
            foreach ($runtime in $runtimes) {
              $prefix = "$app-v$version-$runtime"
              $payloads = if ($runtime -like "win-*") { @("$prefix.exe", "$prefix-setup.exe") } elseif ($runtime -like "linux-*") { @("$prefix.zip", "$prefix-installer.zip") } else { @("$prefix.zip", "$prefix-apps.zip") }
              $required += $payloads
              $required += @($payloads | ForEach-Object { "$_.sha256" })
              $required += @("$prefix-manifest.json", "$prefix.spdx.json", "$prefix.spdx.json.sha256")
            }
            Assert-Release -Tag "$($app.ToLowerInvariant())-v$version" -RequiredAssets $required
          }

          if ("${{ inputs.app }}" -eq "all") {
            $required = @("FreeSuite-v$version-release-manifest.json")
            foreach ($runtime in $runtimes) {
              $prefix = "FreeSuite-v$version-$runtime"
              $payload = if ($runtime -like "win-*") { "$prefix-setup.exe" } elseif ($runtime -like "linux-*") { "$prefix-installer.zip" } else { "$prefix.pkg" }
              $required += @($payload, "$payload.sha256", "$prefix-manifest.json", "$prefix.spdx.json", "$prefix.spdx.json.sha256")
              $required += @("FreeX-v$version-$runtime-manifest.json", "FreeW-v$version-$runtime-manifest.json", "FreeP-v$version-$runtime-manifest.json")
            }
            Assert-Release -Tag "free-suite-v$version" -RequiredAssets $required
          }
