name: Release Readiness

# Why this exists.
#
# eng/test-gates.json declares 11 release-only gates -- the seven WPF host batches, the WPF shell
# lane, and three render-evidence lanes. None of them run on push, so between releases they rot
# invisibly on a green main, and every release attempt then has to pay off however much debt has
# accumulated. That is not hypothetical: releasing 0.8.187 surfaced a stale `bash -n` source pin, a
# stale generated-docs pin, and two scripts that had been broken under Windows PowerShell 5.1 for
# days. Each had been sitting on a green main because only a release would have run the test that
# covered it.
#
# The commit gate cannot simply absorb these lanes. Runner concurrency is capped (linux 5, macos 5,
# ~19 aggregate) and the commit matrix already saturates it, so adding ~15 more jobs per push would
# make every push slower without making main safer.
#
# So the release lanes run on a schedule instead. Rot is then discovered within hours, against the
# commit that caused it, rather than by whoever next tries to ship. This workflow is deliberately
# NOT a merge gate: it reports, it does not block.
on:
  workflow_dispatch:
  schedule:
    # Every six hours. Frequent enough that a regression is attributed to a small range of commits,
    # infrequent enough not to compete with the commit gate for the runner pool.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # Never queue readiness runs behind each other; the newest main is the only interesting one.
  group: release-readiness
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # Same reason as ci.yml: a gate starts MSBuild once per project, and node reuse lets a worker from
  # one invocation hold an intermediate assembly while the next compiles it.
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  # A scheduled run on a commit that already has a recent, fully executed, green readiness run can
  # learn nothing new: the same SHA runs the same gates. Measured over 212 runs, 206 re-tested an
  # already-tested SHA (~12,500 runner-minutes). So a scheduled run is skipped when the newest
  # successful FULL run for this exact SHA is younger than seven days; the weekly forced re-run
  # still catches runner-image and toolchain drift on a quiet main. workflow_dispatch always runs in
  # full, and any failure to read the history fails open (the lanes run).
  #
  # Nothing consumes readiness conclusions as evidence: Resolve-GitHubReleaseCandidate.ps1 and
  # full-release.yml only look at ci.yml and codeql.yml, so a skipped run cannot make a release
  # candidate unresolvable. A skipped run concludes success (all gate jobs skipped). Release-gate\n  # evidence reuse (tools/Resolve-ReleaseGateEvidence.ps1) accepts only a run that holds every\n  # expected gate job, so a skipped run is never mistaken for evidence and the resolver walks past it.
  # A skipped run is itself "success", so a run only counts as a FULL run when its "Select release
  # gates" job succeeded; otherwise skipped runs would extend the window forever.
  guard:
    name: Skip unchanged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only access to this repository's run history; no checkout, no contents access.
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Decide whether this commit needs a full readiness run
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $skip = 'false'
          $reason = "event '$($env:EVENT_NAME)' always runs in full."
          try {
            if ($env:EVENT_NAME -eq 'schedule') {
              $maxAgeDays = 7
              $reason = "no successful full readiness run exists for $($env:SHA); running in full."
              # status=success matches on conclusion; --jq emits plain strings so no date parsing
              # is done by the JSON converter.
              $rows = gh api --method GET "repos/$($env:REPOSITORY)/actions/workflows/release-readiness.yml/runs" `
                -f "head_sha=$($env:SHA)" -f status=success -f per_page=100 `
                --jq '.workflow_runs[] | [.id, .run_started_at] | @tsv'
              if ($LASTEXITCODE -ne 0) { throw "gh api failed listing readiness runs (exit $LASTEXITCODE)." }
              $candidates = @($rows | Where-Object { $_ } | ForEach-Object {
                  $parts = $_ -split "`t"
                  [pscustomobject]@{ Id = $parts[0]; Started = [DateTimeOffset]::Parse($parts[1], [System.Globalization.CultureInfo]::InvariantCulture) }
                } | Where-Object { $_.Id -ne $env:RUN_ID } | Sort-Object Started -Descending)
              foreach ($candidate in $candidates) {
                $jobRows = gh api --method GET "repos/$($env:REPOSITORY)/actions/runs/$($candidate.Id)/jobs" `
                  -f per_page=100 `
                  --jq '.jobs[] | [.name, .conclusion] | @tsv'
                if ($LASTEXITCODE -ne 0) { throw "gh api failed listing jobs of run $($candidate.Id) (exit $LASTEXITCODE)." }
                $prepared = @($jobRows | Where-Object { $_ -eq "Select release gates`tsuccess" })
                if ($prepared.Count -eq 0) { continue }
                # Newest full green run for this SHA.
                $ageDays = ([DateTimeOffset]::UtcNow - $candidate.Started).TotalDays
                if ($ageDays -lt $maxAgeDays) {
                  $skip = 'true'
                  $reason = "run $($candidate.Id) already passed in full on $($env:SHA) $([math]::Round($ageDays, 1)) days ago (< $maxAgeDays); skipping."
                }
                else {
                  $reason = "newest full run $($candidate.Id) for $($env:SHA) is $([math]::Round($ageDays, 1)) days old (>= $maxAgeDays); forcing the weekly full run."
                }
                break
              }
            }
          }
          catch {
            $skip = 'false'
            $reason = "could not read readiness history ($($_.Exception.Message)); failing open and running in full."
          }
          Write-Host $reason
          "skip=$skip" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Release readiness guard: skip=$skip. $reason" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  prepare:
    name: Select release gates
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout gate manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build the release matrix from the repository contract
        id: matrix
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-TestGateMatrix.ps1 -Gate release -GitHubOutputPath $env:GITHUB_OUTPUT

  gates:
    name: ${{ matrix.app }} ${{ matrix.platform }} ${{ matrix.displayGateId }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetchDepth }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-
      # Separate cache namespace from ci.yml: these are different gate ids building different
      # projects, and sharing a key would make each lane evict the other's entries.
      - name: Restore build output cache
        id: buildcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/obj
            obj-build-cache-commit.txt
          key: readiness-v1-${{ runner.os }}-${{ matrix.displayGateId }}-${{ github.sha }}
          restore-keys: readiness-v1-${{ runner.os }}-${{ matrix.displayGateId }}-
      - name: Make build-cache timestamps honest
        shell: pwsh
        run: pwsh -NoProfile -File tools/Set-BuildCacheTimestamps.ps1
      - name: Record the commit this cache will hold
        shell: pwsh
        run: '"${{ github.sha }}" | Set-Content -LiteralPath obj-build-cache-commit.txt -Encoding ascii'
      - name: Run release gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate release `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -GateId "${{ matrix.gateId }}" `
            -PartitionIndex ${{ matrix.partitionIndex }} `
            -PartitionCount ${{ matrix.partitionCount }} `
            -HangTimeout 15m `
            -ResultsDirectory TestResults
      # Only cache a coherent tree: a job that died midway leaves a partial obj/, and restoring one
      # fails outright with "CSC : error CS2012 ... Could not find a part of the path".
      - name: Save build output cache
        if: steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/obj
            obj-build-cache-commit.txt
          key: readiness-v1-${{ runner.os }}-${{ matrix.displayGateId }}-${{ github.sha }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readiness-${{ matrix.platform }}-${{ matrix.displayGateId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 7

  readme-freshness:
    # The README's download links are what a new tester follows, and no release updates them: they
    # had drifted seventeen releases behind while every link still resolved, to a stale build. This
    # needs the network and compares against state outside the repository, so it belongs here on the
    # schedule rather than in the commit gate.
    name: README download links
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare advertised downloads against the newest published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File tools/Test-ReadmeDownloadFreshness.ps1 -Repository "${{ github.repository }}"

  summary:
    name: Release readiness summary
    permissions:
      contents: read
      # Reads this run own job durations to check the dispatch cost hints below.
      actions: read
    needs: [guard, prepare, gates, readme-freshness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Report which release lanes are rotting
        shell: pwsh
        run: |
          $guardResult = "${{ needs.guard.result }}"
          $guardSkip = "${{ needs.guard.outputs.skip }}"
          if ($guardResult -eq 'success' -and $guardSkip -eq 'true') {
            Write-Host "Skipped: this commit already passed a full readiness run within the last seven days."
            exit 0
          }
          # An unreadable guard must not look like a pass: it fails open, so a failed guard job is
          # a workflow defect rather than a skip.
          if ($guardResult -ne 'success') {
            throw "The skip guard did not complete ($guardResult); the readiness lanes did not run."
          }
          $prepareResult = "${{ needs.prepare.result }}"
          $gatesResult = "${{ needs.gates.result }}"
          $readmeResult = "${{ needs['readme-freshness'].result }}"
          if ($prepareResult -ne 'success' -or $gatesResult -ne 'success') {
            throw ("Release lanes are not currently releasable (matrix: $prepareResult; gates: " +
              "$gatesResult). Fix this now rather than at the next release: these gates do not run " +
              "on push, so whatever broke has been invisible on a green main.")
          }
          if ($readmeResult -ne 'success') {
            throw ("Release lanes pass, but the README download links are stale ($readmeResult). " +
              "Testers following the repository front page are being sent to an older build; the " +
              "links still resolve, which is why nothing else catches this.")
          }
          Write-Host "All release-only gates pass on this commit, and the README points at the current release."
      - name: Check the dispatch cost hints against this run
        # After the report above, so a real gate failure is the message people see first.
        if: needs.gates.result == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pwsh -NoProfile -File tools/Test-TestGateCostHints.ps1
          -Repository "${{ github.repository }}"
          -RunId "${{ github.run_id }}"
